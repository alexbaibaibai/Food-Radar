<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>美食雷達 — AI 美食探索</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@300;400;500;700&family=Playfair+Display:ital,wght@0,700;1,400&display=swap" rel="stylesheet">
<style>
/* ═══════════════════════════════
   DESIGN TOKENS
═══════════════════════════════ */
:root {
  --bg:        #0a0a0d;
  --bg2:       #111116;
  --bg3:       #18181f;
  --card:      #14141a;
  --card2:     #1c1c24;
  --border:    rgba(255,255,255,0.06);
  --border2:   rgba(255,255,255,0.11);
  --text:      #eeecf0;
  --text2:     #888790;
  --text3:     #4a4850;
  --accent:    #ff5f2e;
  --accent2:   #ffb020;
  --teal:      #0fd4a8;
  --pink:      #ff4d8f;
  --blue:      #4d8fff;
  --r-sm:      8px;
  --r-md:      14px;
  --r-lg:      20px;
  --r-xl:      28px;
  --shadow:    0 8px 32px rgba(0,0,0,0.5);
  --shadow-sm: 0 2px 12px rgba(0,0,0,0.3);
}

/* ═══════════════════════════════
   RESET & BASE
═══════════════════════════════ */
*, *::before, *::after { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
html { overflow-x:hidden; -webkit-text-size-adjust:100%; }
body {
  font-family: 'Noto Sans TC', sans-serif;
  background: var(--bg);
  color: var(--text);
  min-height: 100vh;
  overflow-x: hidden;
  -webkit-overflow-scrolling: touch;
}
button, input, select, textarea {
  font-family: inherit;
  font-size: 16px; /* prevent iOS zoom */
}
a { color: inherit; text-decoration: none; }
img { display: block; max-width: 100%; }

/* ═══════════════════════════════
   AMBIENT BACKGROUND
═══════════════════════════════ */
.ambient {
  position: fixed; inset: 0; pointer-events: none; z-index: 0; overflow: hidden;
}
.ambient-orb {
  position: absolute; border-radius: 50%; filter: blur(100px); opacity: .6;
}
.orb-a { width:500px; height:500px; background:radial-gradient(circle,rgba(255,95,46,.1),transparent 70%); top:-150px; right:-100px; }
.orb-b { width:400px; height:400px; background:radial-gradient(circle,rgba(13,212,168,.07),transparent 70%); bottom:-100px; left:-100px; }
.noise {
  position: fixed; inset: 0; pointer-events: none; z-index: 0; opacity: .025;
  background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.85' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)'/%3E%3C/svg%3E");
}

/* ═══════════════════════════════
   LAYOUT WRAPPER
═══════════════════════════════ */
#app { position: relative; z-index: 1; min-height: 100vh; }
.page { display: none; }
.page.active { display: block; }

/* ═══════════════════════════════
   MAIN APP HEADER
═══════════════════════════════ */
#page-main { padding-bottom: 80px; }
.app-header {
  position: sticky; top: 0; z-index: 100;
  background: rgba(10,10,13,.88); backdrop-filter: blur(20px);
  border-bottom: 1px solid var(--border);
  padding: 0 20px;
}
.app-header-inner {
  max-width: 860px; margin: 0 auto;
  height: 56px; display: flex; align-items: center; justify-content: space-between;
}
.app-logo {
  font-family: 'Playfair Display', serif;
  font-size: 20px; font-weight: 700; display: flex; align-items: center; gap: 6px;
}
.app-logo em { color: var(--accent); font-style: italic; }
.header-right { display: flex; align-items: center; gap: 10px; }
.loc-chip {
  display: flex; align-items: center; gap: 6px;
  background: var(--bg3); border: 1px solid var(--border);
  border-radius: 99px; padding: 5px 12px;
  font-size: 12px; color: var(--text2); cursor: pointer;
  transition: all .2s; max-width: 140px; overflow: hidden;
  white-space: nowrap; text-overflow: ellipsis;
}
.loc-chip:hover { border-color: var(--border2); color: var(--text); }
.loc-pulse {
  width: 6px; height: 6px; border-radius: 50%;
  background: var(--teal); flex-shrink: 0;
  box-shadow: 0 0 0 0 rgba(13,212,168,.4);
  animation: locPulse 2s infinite;
}
@keyframes locPulse {
  0%   { box-shadow: 0 0 0 0 rgba(13,212,168,.4); }
  70%  { box-shadow: 0 0 0 6px rgba(13,212,168,0); }
  100% { box-shadow: 0 0 0 0 rgba(13,212,168,0); }
}

/* ═══════════════════════════════
   MAIN CONTENT AREA
═══════════════════════════════ */
.main-body { max-width: 860px; margin: 0 auto; padding: 0 16px; }

/* ═══════════════════════════════
   SEARCH SECTION
═══════════════════════════════ */
.search-section { padding: 20px 0 14px; }
.search-box {
  background: var(--card); border: 1px solid var(--border);
  border-radius: var(--r-lg); overflow: hidden;
  transition: border-color .2s, box-shadow .2s;
}
.search-box:focus-within {
  border-color: rgba(255,95,46,.35);
  box-shadow: 0 0 0 3px rgba(255,95,46,.07);
}
.search-textarea {
  width: 100%; background: transparent; border: none; outline: none;
  padding: 16px 18px 10px; color: var(--text); resize: none;
  height: 70px; line-height: 1.6;
}
.search-textarea::placeholder { color: var(--text3); }
.search-footer {
  display: flex; align-items: center;
  padding: 8px 12px 12px; gap: 8px;
}
.quick-tags {
  display: flex; gap: 5px; flex: 1;
  overflow-x: auto; scrollbar-width: none;
}
.quick-tags::-webkit-scrollbar { display: none; }
.qtag {
  flex-shrink: 0; background: transparent;
  border: 1px solid var(--border); border-radius: 99px;
  padding: 5px 11px; font-size: 12px; color: var(--text3);
  cursor: pointer; white-space: nowrap;
  transition: all .15s; touch-action: manipulation;
}
.qtag:hover, .qtag:active { border-color: var(--accent); color: var(--accent); }
.search-go {
  flex-shrink: 0; background: var(--accent); color: #fff;
  border: none; border-radius: 99px;
  padding: 9px 18px; font-size: 13px; font-weight: 500;
  cursor: pointer; touch-action: manipulation;
  transition: all .2s; white-space: nowrap;
  display: flex; align-items: center; gap: 5px;
}
.search-go:hover { background: #ff7a52; }
.search-go:disabled { opacity: .5; pointer-events: none; }

/* ═══════════════════════════════
   LOCATION BAR
═══════════════════════════════ */
.loc-bar { padding: 0 0 12px; }
.loc-input-row {
  background: var(--card); border: 1px solid var(--border);
  border-radius: var(--r-md); padding: 11px 14px;
  display: flex; align-items: center; gap: 8px;
  transition: border-color .2s;
  margin-bottom: 8px;
}
.loc-input-row:focus-within { border-color: rgba(13,212,168,.35); }
.loc-input {
  flex: 1; background: transparent; border: none; outline: none;
  color: var(--text); min-width: 0;
}
.loc-input::placeholder { color: var(--text3); }
.loc-btn-row { display: flex; gap: 8px; }
.btn-loc-search {
  flex: 1; background: var(--bg3); color: var(--text2);
  border: 1px solid var(--border); border-radius: var(--r-sm);
  padding: 10px; font-size: 13px; cursor: pointer;
  touch-action: manipulation; transition: all .15s; text-align: center;
}
.btn-loc-search:hover { border-color: var(--border2); color: var(--text); }
.btn-loc-auto {
  flex: 1; background: var(--teal); color: #0a0a0d;
  border: none; border-radius: var(--r-sm);
  padding: 10px; font-size: 13px; font-weight: 500;
  cursor: pointer; touch-action: manipulation;
  transition: opacity .15s; text-align: center;
}
.btn-loc-auto:hover { opacity: .85; }
.btn-loc-auto:disabled { opacity: .5; pointer-events: none; }

/* ═══════════════════════════════
   CONTROL PANEL (Sort + Filter)
═══════════════════════════════ */
.control-panel { padding: 0 0 14px; display: flex; flex-direction: column; gap: 8px; }
.control-row { display: flex; align-items: center; gap: 8px; }
.ctrl-label { font-size: 11px; color: var(--text3); flex-shrink: 0; width: 26px; letter-spacing: .04em; }
.ctrl-pills { display: flex; gap: 5px; overflow-x: auto; scrollbar-width: none; align-items: center; }
.ctrl-pills::-webkit-scrollbar { display: none; }
.sort-pill, .cat-pill {
  flex-shrink: 0; background: var(--card);
  border: 1px solid var(--border); border-radius: 99px;
  padding: 6px 13px; font-size: 12px; color: var(--text2);
  cursor: pointer; white-space: nowrap;
  transition: all .15s; touch-action: manipulation;
}
.sort-pill:hover, .cat-pill:hover { border-color: var(--border2); color: var(--text); }
.sort-pill.on { border-color: var(--accent); color: var(--accent); background: rgba(255,95,46,.08); }
.cat-pill.on  { border-color: var(--accent2); color: var(--accent2); background: rgba(255,176,32,.08); }
.cat-dot { display: inline-block; width: 6px; height: 6px; border-radius: 50%; margin-right: 4px; vertical-align: middle; }
.radius-sel {
  flex-shrink: 0; background: var(--card);
  border: 1px solid var(--border); border-radius: 99px;
  padding: 6px 12px; font-size: 12px; color: var(--text2);
  outline: none; cursor: pointer;
}

/* ═══════════════════════════════
   RECENT SEARCHES
═══════════════════════════════ */
.recent-section { padding: 0 0 10px; display: none; }
.recent-label { font-size: 11px; color: var(--text3); margin-bottom: 6px; letter-spacing: .04em; }
.recent-tags { display: flex; gap: 5px; flex-wrap: wrap; }
.recent-tag {
  background: var(--bg3); border: none; border-radius: 99px;
  padding: 4px 10px; font-size: 11px; color: var(--text2);
  cursor: pointer; display: flex; align-items: center; gap: 5px;
  touch-action: manipulation; transition: all .15s;
}
.recent-tag:hover { color: var(--text); }
.recent-tag-x { color: var(--text3); font-size: 10px; line-height: 1; }

/* ═══════════════════════════════
   RESULTS HEADER
═══════════════════════════════ */
.results-header {
  display: flex; align-items: center; justify-content: space-between;
  padding: 4px 0 12px;
}
.results-count { font-size: 12px; color: var(--text3); }
.results-count strong { color: var(--text2); }

/* ═══════════════════════════════
   RESTAURANT CARD
═══════════════════════════════ */
.card-list { display: flex; flex-direction: column; gap: 10px; }
.r-card {
  background: var(--card); border: 1px solid var(--border);
  border-radius: var(--r-lg); overflow: hidden;
  cursor: pointer; transition: all .22s;
  position: relative;
}
.r-card:hover { border-color: var(--border2); transform: translateY(-2px); box-shadow: var(--shadow); }
.r-card:active { transform: scale(.99); opacity: .92; }
.r-card.is-top { border-color: rgba(255,95,46,.25); }
.r-card.is-top::before {
  content: ''; position: absolute; top: 0; left: 0; right: 0;
  height: 2px; background: linear-gradient(90deg, var(--accent), var(--accent2));
}
.r-card-inner { display: flex; min-height: 120px; }

/* Card image */
.r-card-img {
  width: 108px; flex-shrink: 0; position: relative;
  background: var(--bg3); overflow: hidden;
}
.r-card-img img {
  width: 100%; height: 100%; object-fit: cover;
  transition: transform .3s;
}
.r-card:hover .r-card-img img { transform: scale(1.04); }
.r-card-emoji {
  width: 100%; height: 100%; min-height: 120px;
  display: flex; align-items: center; justify-content: center;
  font-size: 34px;
}
.r-card-rank {
  position: absolute; top: 8px; left: 8px;
  background: rgba(0,0,0,.72); backdrop-filter: blur(4px);
  color: var(--text); font-size: 10px; font-weight: 500;
  padding: 2px 7px; border-radius: 99px;
}

/* Card body */
.r-card-body { flex: 1; padding: 12px 14px; display: flex; flex-direction: column; gap: 0; min-width: 0; }
.r-card-top { display: flex; justify-content: space-between; align-items: flex-start; margin-bottom: 4px; }
.r-card-name { font-size: 15px; font-weight: 500; line-height: 1.3; }
.r-card-type { font-size: 11px; color: var(--text3); margin-top: 1px; }
.r-score-wrap { text-align: right; flex-shrink: 0; margin-left: 8px; }
.r-score {
  font-family: 'Playfair Display', serif;
  font-size: 24px; font-weight: 700; color: var(--accent2); line-height: 1;
}
.r-score-label { font-size: 9px; color: var(--text3); letter-spacing: .04em; }
.r-stars { display: flex; justify-content: flex-end; gap: 1px; margin-bottom: 2px; }
.r-star { font-size: 10px; color: var(--text3); }
.r-star.on { color: var(--accent2); }

/* Card address */
.r-card-addr { font-size: 12px; color: var(--text2); line-height: 1.5; margin-bottom: 7px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

/* AI reason */
.r-ai-reason {
  background: linear-gradient(135deg, rgba(255,95,46,.07), rgba(255,176,32,.04));
  border: 1px solid rgba(255,95,46,.12);
  border-radius: var(--r-sm); padding: 7px 10px; margin-bottom: 7px;
  font-size: 11px; color: var(--text2); line-height: 1.5;
  display: none;
}
.r-ai-reason.visible { display: block; }
.r-ai-reason-icon { font-size: 10px; color: var(--accent); margin-right: 4px; }

/* Card badges */
.r-badges { display: flex; gap: 4px; flex-wrap: wrap; margin-bottom: 7px; }
.badge {
  font-size: 10px; padding: 2px 8px; border-radius: 99px;
  white-space: nowrap; font-weight: 400;
}
.badge-orange { background: rgba(255,95,46,.12); color: #ff9a7a; }
.badge-teal   { background: rgba(13,212,168,.1); color: var(--teal); }
.badge-yellow { background: rgba(255,176,32,.1); color: var(--accent2); }
.badge-pink   { background: rgba(255,77,143,.1); color: var(--pink); }
.badge-blue   { background: rgba(77,143,255,.1); color: var(--blue); }
.badge-gray   { background: var(--bg3); color: var(--text3); }

/* Card meta */
.r-card-meta { display: flex; align-items: center; gap: 10px; flex-wrap: nowrap; overflow: hidden; margin-top: auto; }
.r-meta-item { font-size: 11px; color: var(--text3); white-space: nowrap; display: flex; align-items: center; gap: 3px; }
.r-open  { font-size: 10px; padding: 2px 6px; border-radius: 99px; background: rgba(13,212,168,.1); color: var(--teal); }
.r-close { font-size: 10px; padding: 2px 6px; border-radius: 99px; background: rgba(255,95,95,.1); color: #ff6b6b; }
.r-fav-btn {
  margin-left: auto; flex-shrink: 0;
  background: none; border: none; font-size: 17px;
  cursor: pointer; padding: 2px 4px;
  touch-action: manipulation; line-height: 1;
  transition: transform .15s;
}
.r-fav-btn:active { transform: scale(1.35); }

 30%{transform:translateY(-4px);opacity:1} }

/* ═══════════════════════════════
   STATE BOXES
═══════════════════════════════ */
.state-box { text-align: center; padding: 56px 20px; }
.state-icon { font-size: 42px; margin-bottom: 14px; opacity: .4; }
.state-title { font-size: 15px; color: var(--text2); margin-bottom: 6px; }
.state-sub { font-size: 13px; color: var(--text3); line-height: 1.6; }
.spinner {
  width: 28px; height: 28px; margin: 0 auto 14px;
  border: 2px solid var(--border2); border-top-color: var(--accent);
  border-radius: 50%; animation: spin .7s linear infinite;
}
@keyframes spin { to { transform: rotate(360deg); } }
.no-more { text-align: center; padding: 18px; font-size: 12px; color: var(--text3); }

/* ═══════════════════════════════
   DETAIL MODAL
═══════════════════════════════ */
.modal-overlay {
  position: fixed; inset: 0; z-index: 400;
  background: rgba(0,0,0,.72);
  display: flex; align-items: flex-end; justify-content: center;
  cursor: pointer; opacity: 0; pointer-events: none;
  transition: opacity .22s;
}
.modal-overlay.open { opacity: 1; pointer-events: auto; }
.modal-sheet {
  background: var(--card2); border: 1px solid var(--border2);
  border-radius: var(--r-xl) var(--r-xl) 0 0;
  width: 100%; max-width: 600px; max-height: 88vh;
  overflow-y: auto; cursor: default;
  transform: translateY(100%);
  transition: transform .28s cubic-bezier(.32,.72,0,1);
  -webkit-overflow-scrolling: touch;
}
.modal-overlay.open .modal-sheet { transform: translateY(0); }
.modal-handle {
  width: 36px; height: 4px; background: var(--border2);
  border-radius: 99px; margin: 12px auto 0;
}
.modal-head {
  padding: 14px 20px 12px;
  border-bottom: 1px solid var(--border);
  display: flex; justify-content: space-between; align-items: flex-start;
  position: sticky; top: 0; background: var(--card2); z-index: 1;
}
.modal-name { font-size: 19px; font-weight: 500; line-height: 1.3; }
.modal-subtype { font-size: 12px; color: var(--text3); margin-top: 2px; }
.modal-head-right { display: flex; gap: 8px; align-items: center; flex-shrink: 0; margin-left: 10px; }
.modal-fav-btn {
  background: var(--bg3); border: 1px solid var(--border);
  width: 38px; height: 38px; border-radius: 50%;
  font-size: 18px; cursor: pointer; display: flex;
  align-items: center; justify-content: center;
  touch-action: manipulation; transition: all .15s;
}
.modal-fav-btn:active { transform: scale(1.2); }
.modal-close {
  background: var(--bg3); border: 1px solid var(--border2);
  width: 38px; height: 38px; border-radius: 50%; color: var(--text);
  font-size: 18px; cursor: pointer; display: flex;
  align-items: center; justify-content: center;
  touch-action: manipulation; font-weight: 300;
}
.modal-body { padding: 16px 20px 24px; }
.modal-ai-box {
  background: linear-gradient(135deg,rgba(255,95,46,.08),rgba(255,176,32,.05));
  border: 1px solid rgba(255,95,46,.18);
  border-radius: var(--r-md); padding: 14px 16px; margin-bottom: 16px;
  display: none;
}
.modal-ai-box.visible { display: block; }
.modal-ai-label { font-size: 11px; color: var(--accent); letter-spacing: .05em; margin-bottom: 6px; font-weight: 500; }
.modal-ai-text { font-size: 13px; color: var(--text2); line-height: 1.7; }
.modal-ai-text em { color: var(--accent2); font-style: normal; }
.modal-row {
  display: flex; align-items: flex-start; gap: 10px;
  padding: 11px 0; border-bottom: 1px solid var(--border);
  font-size: 13px;
}
.modal-row:last-child { border-bottom: none; }
.modal-row-icon { font-size: 15px; flex-shrink: 0; margin-top: 1px; width: 20px; text-align: center; }
.modal-row-val { color: var(--text2); flex: 1; line-height: 1.6; }
.modal-row-action { color: var(--teal); font-size: 11px; flex-shrink: 0; }
.modal-row.clickable { cursor: pointer; }
.modal-row.clickable:active { background: rgba(13,212,168,.05); border-radius: var(--r-sm); margin: 0 -8px; padding: 11px 8px; }
.modal-nav-btn {
  width: 100%; background: var(--teal); color: #0a0a0d;
  border: none; border-radius: var(--r-md); padding: 14px;
  font-size: 14px; font-weight: 600; cursor: pointer;
  touch-action: manipulation; margin-top: 16px;
  transition: opacity .15s;
}
.modal-nav-btn:hover { opacity: .88; }

/* ═══════════════════════════════
   FAVORITES PANEL
═══════════════════════════════ */
.fav-panel {
  position: fixed; inset: 0; z-index: 300;
  background: var(--bg); overflow-y: auto;
  transform: translateX(100%);
  transition: transform .32s cubic-bezier(.32,.72,0,1);
  -webkit-overflow-scrolling: touch;
}
.fav-panel.open { transform: translateX(0); }
.fav-panel-head {
  position: sticky; top: 0; background: var(--bg);
  padding: 16px 20px; border-bottom: 1px solid var(--border);
  display: flex; align-items: center; justify-content: space-between; z-index: 1;
}
.fav-panel-title { font-size: 18px; font-weight: 500; }
.fav-close {
  background: var(--bg3); border: 1px solid var(--border);
  width: 36px; height: 36px; border-radius: 50%; color: var(--text);
  font-size: 16px; cursor: pointer; display: flex;
  align-items: center; justify-content: center;
}
.fav-body { padding: 16px; }
.fav-empty { text-align: center; padding: 60px 20px; color: var(--text3); }
.fav-empty-icon { font-size: 44px; margin-bottom: 14px; opacity: .35; }

/* ═══════════════════════════════
   BOTTOM NAV
═══════════════════════════════ */
.bottom-nav {
  position: fixed; bottom: 0; left: 0; right: 0; z-index: 200;
  background: rgba(10,10,13,.92); backdrop-filter: blur(20px);
  border-top: 1px solid var(--border);
  display: flex; padding: 6px 0;
  padding-bottom: max(6px, env(safe-area-inset-bottom));
}
.bnav-btn {
  flex: 1; display: flex; flex-direction: column; align-items: center; gap: 3px;
  padding: 6px 0; background: none; border: none; color: var(--text3);
  font-size: 10px; cursor: pointer; touch-action: manipulation;
  transition: color .15s; letter-spacing: .02em;
}
.bnav-btn.on { color: var(--accent); }
.bnav-icon { font-size: 22px; line-height: 1; }

/* ═══════════════════════════════
   TOAST
═══════════════════════════════ */
.toast {
  position: fixed; bottom: 80px; left: 50%;
  transform: translateX(-50%) translateY(16px);
  background: var(--bg3); border: 1px solid var(--border2);
  border-radius: 99px; padding: 10px 20px;
  font-size: 13px; color: var(--text); z-index: 999;
  opacity: 0; pointer-events: none;
  transition: all .28s; white-space: nowrap;
  box-shadow: var(--shadow-sm);
}
.toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }

/* ═══════════════════════════════
   MAP VIEW
═══════════════════════════════ */
#map-view { display: none; }
#map-view.active { display: block; height: 280px; }
#map { height: 100%; }
.map-toggle {
  display: flex; background: var(--card); border: 1px solid var(--border);
  border-radius: 99px; padding: 3px; gap: 2px;
}
.mtab {
  padding: 4px 13px; border-radius: 99px; font-size: 12px;

  transition: all .15s; touch-action: manipulation;
}
.mtab.on { background: var(--bg3); color: var(--text); }

/* ═══════════════════════════════
   ANIMATIONS
═══════════════════════════════ */
.fade-up {
  opacity: 0; transform: translateY(12px);
  animation: fadeUp .35s ease forwards;
}
@keyframes fadeUp { to { opacity:1; transform:translateY(0); } }
.fade-up:nth-child(1){animation-delay:.04s}
.fade-up:nth-child(2){animation-delay:.08s}

/* ═══════════════════════════════
   DESKTOP
═══════════════════════════════ */

<div class="toast" id="toast"></div>

<script>
'use strict';

/* ══════════════════════════════════════
   STATE
══════════════════════════════════════ */
const S = {
  apiKey: '',
  lat: null, lng: null,
  category: 'restaurant',
  radius: 1000,
  sort: 'score',
  places: [],
  favs: JSON.parse(localStorage.getItem('fr_favs2') || '[]'),
  recent: JSON.parse(localStorage.getItem('fr_recent2') || '[]'),
  currentPlace: null,
  map: null, markers: [],
  placeSvc: null,
  loading: false,
};

const CAT = {
  restaurant: { label:'餐廳', emoji:'🍽', color:'#ff5f2e' },
  cafe:       { label:'咖啡廳', emoji:'☕', color:'#ffb020' },
  bar:        { label:'酒吧', emoji:'🥃', color:'#0fd4a8' },
  bakery:     { label:'烘焙甜點', emoji:'🥐', color:'#ff4d8f' },
};

/* ══════════════════════════════════════
   SETUP
══════════════════════════════════════ */

function showPage(id) {
  document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));
  document.getElementById(id).classList.add('active');
}

/* ══════════════════════════════════════
   GOOGLE MAPS SDK
══════════════════════════════════════ */
function loadSDK() {
  const s = document.createElement('script');
  s.src = `https://maps.googleapis.com/maps/api/js?key=AIzaSyDpCBAVT93wWu85aTT57ANiLtgzxaQNY2A&libraries=places&language=zh-TW&callback=onSDKReady`;
  s.async = true;
  s.onerror = () => toast('❌ API Key 無效');
  document.head.appendChild(s);
}

window.onSDKReady = function() {
  initMap();
  getLocation();
  renderRecent();
};

/* ══════════════════════════════════════
   MAP
══════════════════════════════════════ */
function initMap() {
  S.map = new google.maps.Map(document.getElementById('map'), {
    center: { lat: 25.0339, lng: 121.5645 },
    zoom: 15,
    disableDefaultUI: true,
    zoomControl: true,
    styles: [
      { elementType:'geometry', stylers:[{color:'#1a1a22'}] },
      { elementType:'labels.text.stroke', stylers:[{color:'#1a1a22'}] },
      { elementType:'labels.text.fill', stylers:[{color:'#888790'}] },
      { featureType:'road', elementType:'geometry', stylers:[{color:'#252530'}] },
      { featureType:'water', elementType:'geometry', stylers:[{color:'#0d0d18'}] },
      { featureType:'poi', stylers:[{visibility:'off'}] },
    ]
  });
  S.placeSvc = new google.maps.places.PlacesService(S.map);
}

function setView(v, el) {
  document.querySelectorAll('.mtab').forEach(t => t.classList.remove('on'));
  el.classList.add('on');
  const mv = document.getElementById('map-view');
  mv.classList.toggle('active', v === 'map');
  if (v === 'map' && S.map) google.maps.event.trigger(S.map, 'resize');
}

function updateMarkers(places) {
  S.markers.forEach(m => m.setMap(null));
  S.markers = [];
  if (!S.map) return;
  places.forEach((p, i) => {
    const loc = p.geometry?.location;
    if (!loc) return;
    const m = new google.maps.Marker({
      position: loc, map: S.map,
      label: { text: String(i+1), color:'#fff', fontSize:'11px', fontWeight:'500' },
      icon: { path: google.maps.SymbolPath.CIRCLE, scale:14,
        fillColor: i===0 ? '#ff5f2e':'#1c1c24',
        fillOpacity:1, strokeColor:'#ff5f2e', strokeWeight:1.5 }
    });
    m.addListener('click', () => openDetail(p.place_id));
    S.markers.push(m);
  });
  if (S.lat) S.map.setCenter({ lat:S.lat, lng:S.lng });
}

/* ══════════════════════════════════════
   GEOLOCATION
══════════════════════════════════════ */
function getLocation() {
  if (!navigator.geolocation) { setLocLabel('無法定位'); fetchPlaces(); return; }
  navigator.geolocation.getCurrentPosition(pos => {
    S.lat = pos.coords.latitude;
    S.lng = pos.coords.longitude;
    reverseGeo(S.lat, S.lng);
    if (S.map) S.map.setCenter({ lat:S.lat, lng:S.lng });
    fetchPlaces();
  }, () => {
    S.lat = 25.0339; S.lng = 121.5645;
    setLocLabel('台北市信義區');
    fetchPlaces();
  });
}

function autoLocate() {
  const btn = document.getElementById('autoLocBtn');
  btn.textContent = '定位中...'; btn.disabled = true;
  navigator.geolocation.getCurrentPosition(pos => {
    S.lat = pos.coords.latitude; S.lng = pos.coords.longitude;
    reverseGeo(S.lat, S.lng);
    if (S.map) { S.map.setCenter({lat:S.lat,lng:S.lng}); S.map.setZoom(15); }
    document.getElementById('locInput').value = '';
    fetchPlaces();
    btn.textContent = '⊙ 自動定位'; btn.disabled = false;
    toast('✓ 已更新至目前位置');
  }, () => {
    toast('❌ 無法取得位置，請確認定位權限');
    btn.textContent = '⊙ 自動定位'; btn.disabled = false;
  });
}

function reverseGeo(lat, lng) {
  const gc = new google.maps.Geocoder();
  gc.geocode({ location:{lat,lng}, language:'zh-TW' }, (res, st) => {
    if (st==='OK' && res[0]) {
      const c = res[0].address_components;
      const d = c.find(x => x.types.includes('administrative_area_level_3')||x.types.includes('sublocality_level_1'));
      const ci = c.find(x => x.types.includes('administrative_area_level_1')||x.types.includes('locality'));
      setLocLabel([ci?.long_name, d?.long_name].filter(Boolean).join(' ') || '目前位置');
    }
  });
}

function setLocLabel(t) {
  document.getElementById('locLabel').textContent = t.length > 10 ? t.slice(0,10)+'…' : t;
}

function searchByAddr() {
  const addr = document.getElementById('locInput').value.trim();
  if (!addr) { toast('請輸入地址或地標'); return; }
  const gc = new google.maps.Geocoder();
  gc.geocode({ address:addr, language:'zh-TW' }, (res, st) => {
    if (st==='OK' && res[0]) {
      S.lat = res[0].geometry.location.lat();
      S.lng = res[0].geometry.location.lng();
      setLocLabel(res[0].formatted_address);
      if (S.map) { S.map.setCenter({lat:S.lat,lng:S.lng}); S.map.setZoom(15); }
      fetchPlaces();
      toast('✓ 已切換搜尋地點');
    } else { toast('❌ 找不到此地址'); }
  });
}

function focusLocInput() { document.getElementById('locInput').focus(); }

/* ══════════════════════════════════════
   FETCH PLACES
══════════════════════════════════════ */
function fetchPlaces(keyword='') {
  if (!S.placeSvc || S.lat===null) return;
  setLoading(true);
  const loc = new google.maps.LatLng(S.lat, S.lng);

  if (keyword) {
    S.placeSvc.textSearch({
      query: keyword, location: loc, radius: S.radius, language:'zh-TW'
    }, handleResults.bind(null, keyword));
  } else {
    S.placeSvc.nearbySearch({
      location: loc, radius: S.radius,
      type: S.category, language:'zh-TW'
    }, handleResults.bind(null, ''));
  }
}

function handleResults(keyword, results, status) {
  setLoading(false);
  const PS = google.maps.places.PlacesServiceStatus;
  if (status === PS.OK) {
    S.places = results;
    renderCards(results, keyword);
    updateMarkers(results);
  } else if (status === 'ZERO_RESULTS') {
    showEmpty('沒有找到店家', keyword ? `找不到「${keyword}」相關結果，試試其他關鍵字` : '試試擴大搜尋範圍');
  } else {
    showEmpty('搜尋失敗', '請確認 API Key 已啟用 Places API');
    toast('❌ ' + status);
  }
}

/* ══════════════════════════════════════
   SCORE & SORT
══════════════════════════════════════ */
function score(p) {
  const r = p.rating || 0;
  const n = p.user_ratings_total || 0;
  // 評論數以100為基準起算，1000則為滿分
  const trustScore = Math.min((n - 100) / 900, 1) * 30;
  return Math.min(100, Math.round((r/5)*60 + Math.max(0, trustScore) + 10));
}

function distM(loc) {
  if (!loc || S.lat===null) return 99999;
  try {
    const la = typeof loc.lat==='function' ? loc.lat() : loc.lat;
    const lo = typeof loc.lng==='function' ? loc.lng() : loc.lng;
    const R=6371000, dLa=(la-S.lat)*Math.PI/180, dLo=(lo-S.lng)*Math.PI/180;
    const a=Math.sin(dLa/2)**2+Math.cos(S.lat*Math.PI/180)*Math.cos(la*Math.PI/180)*Math.sin(dLo/2)**2;
    return R*2*Math.atan2(Math.sqrt(a),Math.sqrt(1-a));
  } catch { return 99999; }
}

function fmtDist(loc) {
  const d = distM(loc);
  return d===99999 ? '—' : d<1000 ? Math.round(d)+'m' : (d/1000).toFixed(1)+'km';
}

function sortPlaces(arr) {
  return [...arr].sort((a,b) => {
    if (S.sort==='rating') return (b.rating||0)-(a.rating||0);
    if (S.sort==='dist')   return distM(a.geometry?.location)-distM(b.geometry?.location);
    return score(b)-score(a);
  });
}

/* ══════════════════════════════════════
   RENDER CARDS
══════════════════════════════════════ */
function renderCards(places, keyword) {
  const list = document.getElementById('cardList');
  // Filter: 4星以上 + 100則評論以上
  const filtered = places.filter(p => (p.rating || 0) >= 4.0 && (p.user_ratings_total || 0) >= 100);
  const sorted = sortPlaces(filtered);
  document.getElementById('resultCount').textContent = sorted.length;

  if (!sorted.length) { showEmpty('沒有找到店家','試試換個條件'); return; }

  list.innerHTML = sorted.map((p,i) => cardHTML(p,i)).join('') +
    `<div class="no-more">— 共 ${sorted.length} 間 —</div>`;


}

function cardHTML(p, i) {
  const sc = score(p);
  const rt = p.rating || 0;
  const rv = p.user_ratings_total || 0;
  let ph = ''; try { ph = p.photos?.[0]?.getUrl({maxWidth:180,maxHeight:180}) || ''; } catch{}
  let isOpen = null; try { isOpen = p.opening_hours?.isOpen?.() ?? null; } catch{}
  const addr = p.vicinity || p.formatted_address || '';
  const isFav = S.favs.some(f => f.id===p.place_id);
  const emoji = CAT[S.category]?.emoji || '🍽';
  const stars = [1,2,3,4,5].map(s=>`<span class="r-star${s<=Math.round(rt)?' on':''}">★</span>`).join('');
  const badges = buildBadges(p);

  return `
  <div class="r-card${i===0?' is-top':''} fade-up" onclick="openDetail('${p.place_id}')">
    <div class="r-card-inner">
      <div class="r-card-img">
        ${ph ? `<img src="${ph}" loading="lazy" alt="${p.name}">` : `<div class="r-card-emoji">${emoji}</div>`}
        <div class="r-card-rank">#${i+1}</div>
      </div>
      <div class="r-card-body">
        <div class="r-card-top">
          <div style="min-width:0">
            <div class="r-card-name">${p.name}</div>
            <div class="r-card-type">${(p.types?.[0]||'').replace(/_/g,' ')}</div>
          </div>
          <div class="r-score-wrap">
            <div class="r-stars">${stars}</div>
            <div class="r-score">${sc}</div>
            <div class="r-score-label">推薦指數</div>
          </div>
        </div>
        <div class="r-card-addr">${addr}</div>

        <div class="r-badges">${badges}</div>
        <div class="r-card-meta">
          <div class="r-meta-item">📍 ${fmtDist(p.geometry?.location)}</div>
          <div class="r-meta-item">💬 ${rv.toLocaleString()}</div>
          <div class="r-meta-item">⭐ ${rt||'—'}</div>
          ${isOpen===true?'<span class="r-open">營業中</span>':isOpen===false?'<span class="r-close">已打烊</span>':''}
          <button class="r-fav-btn" id="cfav-${p.place_id}"
            onclick="event.stopPropagation();quickFav('${p.place_id}','${p.name.replace(/'/g,"\\'")}',${rt},'${addr.replace(/'/g,"\\'")}')">
            ${isFav?'❤️':'🤍'}
          </button>
        </div>
      </div>
    </div>
  </div>`;
}

function buildBadges(p) {
  const r=p.rating||0, n=p.user_ratings_total||0;
  const b=[];
  if (r>=4.7) b.push('<span class="badge badge-orange">🔥 高評分</span>');
  if (n>=2000) b.push('<span class="badge badge-teal">🌊 超人氣</span>');
  else if (n>=500) b.push('<span class="badge badge-teal">熱門</span>');
  if (r>=4.5 && n>=1000) b.push('<span class="badge badge-yellow">✦ 口碑店</span>');
  b.push(`<span class="badge badge-gray">⭐ ${r||'N/A'}</span>`);
  return b.join('');
}

/* ══════════════════════════════════════
   DETAIL MODAL
══════════════════════════════════════ */
function openDetail(placeId) {
  if (!S.placeSvc) return;
  S.placeSvc.getDetails({
    placeId,
    fields:['name','rating','user_ratings_total','formatted_address',
            'formatted_phone_number','website','opening_hours','url',
            'price_level','types','place_id'],
    language:'zh-TW'
  }, (place, status) => {
    if (status !== google.maps.places.PlacesServiceStatus.OK) { toast('無法取得詳細資訊'); return; }
    S.currentPlace = place;
    renderModal(place);
  });
}

function renderModal(p) {
  const priceMap = {0:'免費',1:'$ 平價',2:'$$ 中等',3:'$$$ 較貴',4:'$$$$ 高級'};
  const price = p.price_level!=null ? (priceMap[p.price_level]||'—') : '無資料';
  const hours = p.opening_hours?.weekday_text?.join('<br>') || '—';
  const isFav = S.favs.some(f => f.id===p.place_id);

  document.getElementById('mName').textContent = p.name;
  document.getElementById('mSub').textContent = (p.types?.[0]||'').replace(/_/g,' ');
  document.getElementById('mFavBtn').textContent = isFav ? '❤️':'🤍';


  document.getElementById('mNavBtn').setAttribute('data-addr', p.formatted_address||p.name);

  let rows = `
    <div class="modal-row">
      <span class="modal-row-icon">⭐</span>
      <span class="modal-row-val">${p.rating||'—'} 分（${(p.user_ratings_total||0).toLocaleString()} 則評論）</span>
    </div>
    <div class="modal-row">
      <span class="modal-row-icon">💰</span>
      <span class="modal-row-val">價位：${price}</span>
    </div>
    <div class="modal-row">
      <span class="modal-row-icon">📍</span>
      <span class="modal-row-val">${p.formatted_address||'—'}</span>
    </div>`;

  if (p.formatted_phone_number) {
    const tel = p.formatted_phone_number.replace(/\s/g,'');
    rows += `
    <div class="modal-row clickable" onclick="window.location.href='tel:${tel}'">
      <span class="modal-row-icon">📞</span>
      <span class="modal-row-val" style="color:var(--teal);font-weight:500">${p.formatted_phone_number}</span>
      <span class="modal-row-action">點擊撥號 →</span>
    </div>`;
  }

  rows += `
    <div class="modal-row">
      <span class="modal-row-icon">🕐</span>
      <span class="modal-row-val" style="font-size:12px;line-height:1.8">${hours}</span>
    </div>`;

  if (p.url) rows += `
    <div class="modal-row">
      <span class="modal-row-icon">🗺</span>
      <a href="${p.url}" target="_blank" class="modal-row-val" style="color:var(--blue)">在 Google Maps 查看 →</a>
    </div>`;

  if (p.website) rows += `
    <div class="modal-row">
      <span class="modal-row-icon">🌐</span>
      <a href="${p.website}" target="_blank" class="modal-row-val" style="color:var(--blue)">${p.website.replace(/^https?:\/\//,'').split('/')[0]}</a>
    </div>`;

  document.getElementById('mRows').innerHTML = rows;
  document.getElementById('modal').classList.add('open');
}


function closeModal() { document.getElementById('modal').classList.remove('open'); }
function onModalOverlayClick(e) { if (e.target===document.getElementById('modal')) closeModal(); }
function navToPlace() {
  const addr = document.getElementById('mNavBtn').getAttribute('data-addr');
  const enc = encodeURIComponent(addr);
  const isIOS = /iPad|iPhone|iPod/.test(navigator.userAgent);
  window.open(isIOS ? 'maps://maps.apple.com/?q='+enc : 'https://www.google.com/maps/search/?api=1&query='+enc, '_blank');
}

/* ══════════════════════════════════════
   FAVORITES
══════════════════════════════════════ */
function saveFavs() { localStorage.setItem('fr_favs2', JSON.stringify(S.favs)); }

function quickFav(id, name, rating, addr) {
  const idx = S.favs.findIndex(f => f.id===id);
  const btn = document.getElementById('cfav-'+id);
  if (idx>=0) {
    S.favs.splice(idx,1);
    if(btn) btn.textContent='🤍';
    toast('已移除收藏');
  } else {
    S.favs.push({id, name, rating, addr, cat:S.category});
    if(btn) btn.textContent='❤️';
    toast('✓ 已加入收藏');
  }
  saveFavs();
  updateFavCount();
  if (S.currentPlace?.place_id===id)
    document.getElementById('mFavBtn').textContent = idx>=0?'🤍':'❤️';
}

function toggleModalFav() {
  if (!S.currentPlace) return;
  quickFav(S.currentPlace.place_id, S.currentPlace.name,
    S.currentPlace.rating, S.currentPlace.formatted_address||'');
}

function updateFavCount() {
  const n = S.favs.length;
  document.getElementById('bnavFavIcon').textContent = n>0 ? '❤️':'🤍';
}

function openFav() {
  renderFavList();
  document.getElementById('favPanel').classList.add('open');
  document.querySelectorAll('.bnav-btn').forEach(b=>b.classList.remove('on'));
  document.getElementById('bnavFav').classList.add('on');
}
function closeFav() {
  document.getElementById('favPanel').classList.remove('open');
  document.getElementById('bnavExplore').classList.add('on');
  document.getElementById('bnavFav').classList.remove('on');
}
function bnavHome() {
  closeFav();
  document.querySelectorAll('.bnav-btn').forEach(b=>b.classList.remove('on'));
  document.getElementById('bnavExplore').classList.add('on');
}
function deskNav(tab, el) {
  document.querySelectorAll('.desktop-nav-btn').forEach(b=>b.classList.remove('on'));
  el.classList.add('on');
}

function renderFavList() {
  const body = document.getElementById('favBody');
  if (!S.favs.length) {
    body.innerHTML=`<div class="fav-empty">
      <div class="fav-empty-icon">🤍</div>
      <div class="state-title">還沒有收藏</div>
      <div class="state-sub" style="margin-top:6px">點卡片右下角愛心即可收藏</div>
    </div>`; return;
  }
  body.innerHTML = S.favs.map((f,i)=>`
    <div class="r-card fade-up" style="margin-bottom:10px" onclick="openDetailById('${f.id}')">
      <div class="r-card-inner">
        <div class="r-card-img">
          <div class="r-card-emoji">${CAT[f.cat]?.emoji||'🍽'}</div>
          <div class="r-card-rank">#${i+1}</div>
        </div>
        <div class="r-card-body">
          <div class="r-card-top">
            <div style="min-width:0">
              <div class="r-card-name">${f.name}</div>
              <div class="r-card-type">${f.addr||''}</div>
            </div>
            <div class="r-score-wrap">
              <div class="r-score" style="color:var(--pink);font-size:22px">❤️</div>
            </div>
          </div>
          <div class="r-card-meta" style="margin-top:8px">
            <div class="r-meta-item">⭐ ${f.rating||'—'}</div>
            <button class="r-fav-btn" style="margin-left:auto;font-size:12px;color:var(--text3)"
              onclick="event.stopPropagation();removeFav(${i})">移除</button>
          </div>
        </div>
      </div>
    </div>`).join('');
}

function removeFav(i) {
  S.favs.splice(i,1); saveFavs(); updateFavCount(); renderFavList();
}

function openDetailById(placeId) {
  if (!S.placeSvc) { toast('地圖尚未載入'); return; }
  S.placeSvc.getDetails({
    placeId,
    fields:['name','rating','user_ratings_total','formatted_address',
            'formatted_phone_number','website','opening_hours','url',
            'price_level','types','place_id'],
    language:'zh-TW'
  }, (place, status) => {
    if (status!==google.maps.places.PlacesServiceStatus.OK) { toast('無法取得詳細資訊'); return; }
    S.currentPlace = place;
    closeFav();
    setTimeout(()=>renderModal(place), 320);
  });
}

/* ══════════════════════════════════════
   SEARCH & FILTERS
══════════════════════════════════════ */
function doSearch() {
  const q = document.getElementById('searchTA').value.trim();
  if (q) saveRecent(q);
  fetchPlaces(q);
}

function qs(text) {
  document.getElementById('searchTA').value = text;
  doSearch();
}

function onSearchInput() {
  // clear button handled by browser, nothing needed
}

function setSort(el) {
  document.querySelectorAll('.sort-pill').forEach(b=>b.classList.remove('on'));
  el.classList.add('on');
  S.sort = el.getAttribute('data-sort');
  if (S.places.length) renderCards(S.places, '');
}

function setCat(el) {
  document.querySelectorAll('.cat-pill').forEach(b=>b.classList.remove('on'));
  el.classList.add('on');
  S.category = el.getAttribute('data-cat');
  fetchPlaces();
}

function onRadiusChange() {
  S.radius = parseInt(document.getElementById('radiusSel').value);
  fetchPlaces();
}

/* ══════════════════════════════════════
   RECENT SEARCHES
══════════════════════════════════════ */
function saveRecent(q) {
  S.recent = [q, ...S.recent.filter(r=>r!==q)].slice(0,6);
  localStorage.setItem('fr_recent2', JSON.stringify(S.recent));
  renderRecent();
}

function renderRecent() {
  const sec = document.getElementById('recentSec');
  const tags = document.getElementById('recentTags');
  if (!S.recent.length) { sec.style.display='none'; return; }
  sec.style.display='block';
  tags.innerHTML = S.recent.map(r=>`
    <button class="recent-tag" onclick="qs('${r}')">
      🕐 ${r}
      <span class="recent-tag-x" onclick="event.stopPropagation();removeRecent('${r}')">✕</span>
    </button>`).join('');
}

function removeRecent(r) {
  S.recent = S.recent.filter(x=>x!==r);
  localStorage.setItem('fr_recent2', JSON.stringify(S.recent));
  renderRecent();
}

/* ══════════════════════════════════════
   UI HELPERS
══════════════════════════════════════ */
function setLoading(on) {
  S.loading = on;
  const btn = document.getElementById('searchGoBtn');
  btn.disabled = on;
  document.getElementById('searchGoArrow').textContent = on ? '...' : '→';
  if (on) {
    document.getElementById('cardList').innerHTML=`
      <div class="state-box">
        <div class="spinner"></div>
        <div class="state-title">搜尋附近店家中...</div>
      </div>`;
    document.getElementById('resultCount').textContent = '0';
  }
}

function showEmpty(title, sub) {
  document.getElementById('cardList').innerHTML=`
    <div class="state-box">
      <div class="state-icon">🔍</div>
      <div class="state-title">${title}</div>
      <div class="state-sub">${sub}</div>
    </div>`;
  document.getElementById('resultCount').textContent = '0';
}

let _toastTimer;
function toast(msg) {
  const el = document.getElementById('toast');
  el.textContent = msg; el.classList.add('show');
  clearTimeout(_toastTimer);
  _toastTimer = setTimeout(()=>el.classList.remove('show'), 2800);
}

// iOS input zoom fix
document.addEventListener('DOMContentLoaded', () => {
  document.querySelectorAll('input,textarea').forEach(el=>{
    el.addEventListener('blur', ()=>{
      if (/iPhone|iPad|iPod/.test(navigator.userAgent)) window.scrollTo(0, window.scrollY);
    });
  });
});

/* ══════════════════════════════════════
   INIT
══════════════════════════════════════ */
(function() {
  updateFavCount();
  loadSDK();
})();
</script>
