<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0">
<title>美食雷達 — AI 美食探索</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@300;400;500;700&family=DM+Serif+Display:ital@0;1&display=swap" rel="stylesheet">
<style>
:root {
  --bg: #0d0d0f;
  --bg2: #141418;
  --bg3: #1c1c22;
  --card: #18181f;
  --border: rgba(255,255,255,0.07);
  --border2: rgba(255,255,255,0.12);
  --text: #f0efec;
  --text2: #8a8990;
  --text3: #5a5960;
  --accent: #ff6b35;
  --accent2: #ffaa00;
  --teal: #00c9a7;
  --pink: #ff6b9d;
  --radius: 16px;
}
* { margin: 0; padding: 0; box-sizing: border-box; }
body { font-family: 'Noto Sans TC', sans-serif; background: var(--bg); color: var(--text); min-height: 100vh; overflow-x: hidden; font-size: 16px; }
body::before { content: ''; position: fixed; inset: 0; background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noise'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noise)' opacity='0.03'/%3E%3C/svg%3E"); pointer-events: none; z-index: 0; opacity: 0.4; }
.glow-orb { position: fixed; border-radius: 50%; filter: blur(120px); pointer-events: none; z-index: 0; }
.orb1 { width: 600px; height: 600px; background: radial-gradient(circle, rgba(255,107,53,0.12), transparent 70%); top: -200px; right: -100px; }
.orb2 { width: 400px; height: 400px; background: radial-gradient(circle, rgba(0,201,167,0.08), transparent 70%); bottom: -100px; left: -100px; }

/* HEADER */
header { position: sticky; top: 0; z-index: 100; background: rgba(13,13,15,0.85); backdrop-filter: blur(20px); border-bottom: 1px solid var(--border); padding: 0 24px; }
.header-inner { max-width: 900px; margin: 0 auto; height: 60px; display: flex; align-items: center; justify-content: space-between; }
.logo { font-family: 'DM Serif Display', serif; font-size: 22px; display: flex; align-items: center; gap: 8px; }
.logo span { color: var(--accent); font-style: italic; }
.logo-sub { font-size: 11px; color: var(--text3); font-family: 'Noto Sans TC', sans-serif; letter-spacing: .08em; }
.loc-pill { display: flex; align-items: center; gap: 6px; background: var(--bg3); border: 1px solid var(--border); padding: 6px 12px; border-radius: 99px; font-size: 12px; color: var(--text2); cursor: pointer; transition: all .2s; }
.loc-pill:hover { border-color: var(--border2); color: var(--text); }
.loc-dot { width: 6px; height: 6px; border-radius: 50%; background: var(--teal); box-shadow: 0 0 8px var(--teal); animation: pulse 2s infinite; }
@keyframes pulse { 0%,100%{opacity:1} 50%{opacity:.4} }

/* MAP */
#map-container { display: none; height: 300px; width: 100%; position: relative; z-index: 1; }
#map { height: 100%; width: 100%; }

/* SEARCH */
.search-wrap { max-width: 900px; margin: 0 auto; padding: 32px 24px 16px; position: relative; z-index: 1; }
.search-label { font-size: 13px; color: var(--text3); letter-spacing: .06em; text-transform: uppercase; margin-bottom: 10px; }
.ai-search-box { position: relative; background: var(--card); border: 1px solid var(--border); border-radius: var(--radius); transition: border-color .2s, box-shadow .2s; overflow: hidden; }
.ai-search-box:focus-within { border-color: rgba(255,107,53,0.4); box-shadow: 0 0 0 3px rgba(255,107,53,0.08); }
.ai-search-box textarea { width: 100%; background: transparent; border: none; outline: none; padding: 16px 20px 10px; font-size: 15px; font-family: 'Noto Sans TC', sans-serif; color: var(--text); resize: none; height: 76px; line-height: 1.6; }
.ai-search-box textarea::placeholder { color: var(--text3); }
.search-footer { display: flex; align-items: center; justify-content: space-between; padding: 8px 14px 12px; gap: 10px; }
.quick-tags { display: flex; gap: 5px; flex-wrap: wrap; flex: 1; }
.qtag { font-size: 11px; padding: 4px 10px; border-radius: 99px; border: 1px solid var(--border); color: var(--text3); cursor: pointer; transition: all .15s; background: transparent; font-family: 'Noto Sans TC', sans-serif; white-space: nowrap; }
.qtag:hover { border-color: var(--accent); color: var(--accent); }
.search-btn { background: var(--accent); color: #fff; border: none; padding: 9px 18px; border-radius: 99px; font-size: 13px; font-family: 'Noto Sans TC', sans-serif; cursor: pointer; font-weight: 500; display: flex; align-items: center; gap: 5px; transition: all .2s; white-space: nowrap; flex-shrink: 0; }
.search-btn:hover { background: #ff8556; }
.search-btn:disabled { opacity: .5; pointer-events: none; }

/* FILTER */
.filter-bar { display: none; }
.filter-pill { display: flex; align-items: center; gap: 5px; padding: 6px 13px; border-radius: 99px; border: 1px solid var(--border); font-size: 12px; color: var(--text2); cursor: pointer; transition: all .15s; background: var(--card); font-family: 'Noto Sans TC', sans-serif; }
.filter-pill:hover { border-color: var(--border2); color: var(--text); }
.filter-pill.active { border-color: var(--accent); color: var(--accent); background: rgba(255,107,53,0.08); }
.filter-dot { width: 7px; height: 7px; border-radius: 50%; }
.radius-select { background: var(--card); border: 1px solid var(--border); color: var(--text2); padding: 6px 12px; border-radius: 99px; font-size: 12px; font-family: 'Noto Sans TC', sans-serif; outline: none; cursor: pointer; margin-left: auto; }
.view-toggle { display: flex; background: var(--card); border: 1px solid var(--border); border-radius: 99px; padding: 3px; gap: 2px; }
.vtab { padding: 4px 12px; border-radius: 99px; font-size: 12px; cursor: pointer; transition: all .15s; color: var(--text3); border: none; background: none; font-family: 'Noto Sans TC', sans-serif; }
.vtab.active { background: var(--bg3); color: var(--text); }

/* RESULTS */
.results-area { max-width: 900px; margin: 0 auto; padding: 0 24px 60px; position: relative; z-index: 1; }
.results-header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 14px; }
.results-title { font-size: 13px; color: var(--text3); }
.results-title strong { color: var(--text2); }

/* AI CARD */
.ai-card { background: linear-gradient(135deg, rgba(255,107,53,0.06), rgba(0,201,167,0.04)); border: 1px solid rgba(255,107,53,0.2); border-radius: var(--radius); padding: 16px 20px; margin-bottom: 16px; display: none; }
.ai-header { display: flex; align-items: center; gap: 8px; margin-bottom: 8px; }
.ai-title { font-size: 12px; font-weight: 500; color: var(--accent); letter-spacing: .04em; }
.ai-thinking { font-size: 13px; color: var(--text2); line-height: 1.7; }
.ai-thinking em { color: var(--accent2); font-style: normal; }
.loading-bar { height: 2px; background: var(--bg3); border-radius: 99px; margin-top: 10px; overflow: hidden; display: none; }
.loading-bar.active { display: block; }
.loading-bar-inner { height: 100%; width: 30%; background: linear-gradient(90deg, var(--accent), var(--accent2)); border-radius: 99px; animation: loadSlide 1.2s ease-in-out infinite; }
@keyframes loadSlide { 0%{transform:translateX(-100%)} 100%{transform:translateX(400%)} }

/* RESTAURANT CARD */
.rest-card { background: var(--card); border: 1px solid var(--border); border-radius: var(--radius); margin-bottom: 10px; overflow: hidden; transition: all .25s; cursor: pointer; position: relative; }
.rest-card:hover { border-color: var(--border2); transform: translateY(-2px); box-shadow: 0 12px 40px rgba(0,0,0,0.4); }
.rest-card.top-pick { border-color: rgba(255,107,53,0.3); }
.rest-card.top-pick::before { content: ''; position: absolute; top: 0; left: 0; right: 0; height: 2px; background: linear-gradient(90deg, var(--accent), var(--accent2)); }
.card-inner { display: flex; }
.card-img-wrap { width: 110px; flex-shrink: 0; position: relative; overflow: hidden; background: var(--bg3); }
.card-img { width: 100%; height: 100%; object-fit: cover; display: block; min-height: 120px; }
.card-img-placeholder { width: 100%; min-height: 120px; display: flex; align-items: center; justify-content: center; font-size: 36px; }
.rank-badge { position: absolute; top: 8px; left: 8px; background: rgba(0,0,0,0.75); backdrop-filter: blur(4px); color: var(--text); font-size: 10px; font-weight: 500; padding: 2px 7px; border-radius: 99px; }
.card-body { flex: 1; padding: 14px 16px; }
.card-top { display: flex; justify-content: space-between; align-items: flex-start; margin-bottom: 5px; }
.card-name { font-size: 15px; font-weight: 500; margin-bottom: 2px; line-height: 1.3; }
.card-type { font-size: 11px; color: var(--text3); }
.score-wrap { text-align: right; flex-shrink: 0; margin-left: 10px; }
.score-num { font-family: 'DM Serif Display', serif; font-size: 24px; color: var(--accent2); line-height: 1; }
.score-label { font-size: 10px; color: var(--text3); }
.stars { display: flex; gap: 1px; margin-bottom: 2px; justify-content: flex-end; }
.star { font-size: 10px; }
.star.full { color: var(--accent2); }
.star.empty { color: var(--text3); opacity: .4; }
.card-desc { font-size: 12px; color: var(--text2); line-height: 1.6; margin-bottom: 8px; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
.card-tags { display: flex; gap: 4px; flex-wrap: wrap; margin-bottom: 8px; }
.ctag { font-size: 10px; padding: 2px 8px; border-radius: 99px; }
.ctag-orange { background: rgba(255,107,53,0.12); color: #ff9a7a; }
.ctag-teal { background: rgba(0,201,167,0.1); color: var(--teal); }
.ctag-yellow { background: rgba(255,170,0,0.1); color: var(--accent2); }
.ctag-gray { background: var(--bg3); color: var(--text3); }
.card-meta { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; }
.meta-item { font-size: 11px; color: var(--text3); display: flex; align-items: center; gap: 3px; }
.open-badge { color: var(--teal); font-size: 10px; padding: 2px 6px; background: rgba(0,201,167,0.1); border-radius: 99px; }
.closed-badge { color: #ff6b6b; font-size: 10px; padding: 2px 6px; background: rgba(255,107,107,0.1); border-radius: 99px; }


/* LOCATION BAR */
.loc-bar { max-width: 900px; margin: 0 auto; padding: 0 24px 14px; position: relative; z-index: 1; display: flex; flex-direction: column; gap: 8px; }
.loc-input-wrap { display: flex; gap: 8px; align-items: center; background: var(--card); border: 1px solid var(--border); border-radius: 12px; padding: 10px 14px; transition: border-color .2s; }
.loc-input-wrap:focus-within { border-color: rgba(0,201,167,0.4); }
.loc-input { flex: 1; background: transparent; border: none; outline: none; font-size: 16px; color: var(--text); font-family: 'Noto Sans TC', sans-serif; }
.loc-input::placeholder { color: var(--text3); }
.loc-btn-row { display: flex; gap: 8px; }
.loc-auto-btn { flex: 1; background: var(--teal); color: #0d0d0f; border: none; padding: 10px 14px; border-radius: 12px; font-size: 13px; font-weight: 500; font-family: 'Noto Sans TC', sans-serif; cursor: pointer; text-align: center; transition: all .2s; }
.loc-auto-btn:hover { opacity: .85; }
.loc-search-btn { flex: 1; background: var(--bg3); color: var(--text2); border: 1px solid var(--border); padding: 10px 14px; border-radius: 12px; font-size: 13px; font-family: 'Noto Sans TC', sans-serif; cursor: pointer; text-align: center; transition: all .2s; }
.loc-search-btn:hover { border-color: var(--border2); color: var(--text); }


/* CONTROL PANEL */
.control-panel { max-width: 900px; margin: 0 auto; padding: 0 24px 16px; position: relative; z-index: 1; display: flex; flex-direction: column; gap: 10px; }
.control-row { display: flex; align-items: center; gap: 10px; }
.control-label { font-size: 12px; color: var(--text3); flex-shrink: 0; width: 28px; letter-spacing: .02em; }
.control-pills { display: flex; gap: 6px; flex-wrap: wrap; align-items: center; }

@media (max-width: 600px) {
  .control-panel { padding: 0 14px 12px; gap: 8px; }
  .control-row { gap: 8px; }
  .control-label { font-size: 12px; width: 28px; }
  .control-pills { gap: 6px; overflow-x: auto; flex-wrap: nowrap; -webkit-overflow-scrolling: touch; scrollbar-width: none; }
  .control-pills::-webkit-scrollbar { display: none; }
  .sort-btn { padding: 8px 14px; font-size: 13px; min-height: 36px; flex-shrink: 0; white-space: nowrap; }
  .filter-pill { padding: 8px 14px; font-size: 13px; min-height: 36px; flex-shrink: 0; white-space: nowrap; }
  .radius-select { padding: 8px 12px; font-size: 13px; min-height: 36px; flex-shrink: 0; }
}

/* SORT BAR */
.sort-bar { display: none; }
.sort-label { display: none; }
.filter-bar { display: none; }
.sort-btn { padding: 6px 14px; border-radius: 99px; border: 1px solid var(--border); font-size: 12px; color: var(--text2); cursor: pointer; transition: all .15s; background: var(--card); font-family: 'Noto Sans TC', sans-serif; display: flex; align-items: center; gap: 5px; }
.sort-btn:hover { border-color: var(--border2); color: var(--text); }
.sort-btn.active { border-color: var(--accent); color: var(--accent); background: rgba(255,107,53,0.08); }


/* MOBILE OPTIMIZATIONS */
* { -webkit-tap-highlight-color: transparent; }
body { -webkit-overflow-scrolling: touch; touch-action: pan-y; }


/* ── GLOBAL MOBILE RESET ── */
@media (max-width: 600px) {
  html, body { overflow-x: hidden; width: 100%; }

  header { padding: 0 14px; }
  .header-inner { height: 52px; gap: 8px; }
  .logo { font-size: 18px; gap: 6px; }
  .logo-sub { display: none; }
  .loc-pill { padding: 5px 10px; font-size: 11px; max-width: 130px; overflow: hidden; white-space: nowrap; text-overflow: ellipsis; }
  .view-toggle { display: none; }

  /* SEARCH */
  .search-wrap { padding: 16px 14px 10px; }

  .search-footer { padding: 8px 10px 12px; flex-wrap: nowrap; gap: 8px; }
  .quick-tags { gap: 5px; overflow-x: auto; flex-wrap: nowrap; -webkit-overflow-scrolling: touch; padding-bottom: 2px; scrollbar-width: none; }
  .quick-tags::-webkit-scrollbar { display: none; }
  .qtag { font-size: 12px; padding: 7px 12px; white-space: nowrap; min-height: 34px; flex-shrink: 0; }

  /* LOCATION BAR */
  .loc-bar { padding: 0 14px 10px; gap: 8px; }
  .loc-input-wrap { padding: 10px 12px; border-radius: 12px; }
  .loc-input { font-size: 14px; }
  .loc-btn-row { gap: 8px; }
  .loc-search-btn { padding: 11px 10px; font-size: 13px; min-height: 42px; border-radius: 12px; }
  .loc-auto-btn { padding: 11px 10px; font-size: 13px; min-height: 42px; border-radius: 12px; }

  
/* CONTROL PANEL */

  .control-panel { padding: 0 14px 12px; gap: 8px; }
  .control-row { gap: 8px; }
  .control-label { font-size: 12px; width: 28px; }
  .control-pills { gap: 6px; overflow-x: auto; flex-wrap: nowrap; -webkit-overflow-scrolling: touch; scrollbar-width: none; }
  .control-pills::-webkit-scrollbar { display: none; }
  .sort-btn { padding: 8px 14px; font-size: 13px; min-height: 36px; flex-shrink: 0; white-space: nowrap; }
  .filter-pill { padding: 8px 14px; font-size: 13px; min-height: 36px; flex-shrink: 0; white-space: nowrap; }
  .radius-select { padding: 8px 12px; font-size: 13px; min-height: 36px; flex-shrink: 0; }
}

/* SORT BAR */
  .sort-bar { padding: 0 14px 10px; gap: 6px; overflow-x: auto; flex-wrap: nowrap; -webkit-overflow-scrolling: touch; scrollbar-width: none; }

.filter-pill, .sort-btn, .qtag, .search-btn, .loc-auto-btn, .loc-search-btn {
  -webkit-user-select: none; user-select: none;
  touch-action: manipulation;
}

  display: none;
}

}

  background: none; border: none; font-size: 16px; cursor: pointer;
  padding: 2px 4px; margin-left: auto; touch-action: manipulation;
  line-height: 1; flex-shrink: 0;
}

.fav-panel { position: fixed; inset: 0; z-index: 300; background: var(--bg); transform: translateX(100%); transition: transform .35s cubic-bezier(.32,.72,0,1); overflow-y: auto; }

.fav-header { padding: 20px 20px 16px; border-bottom: 1px solid var(--border); display: flex; align-items: center; justify-content: space-between; position: sticky; top: 0; background: var(--bg); z-index: 1; }

.fav-close { background: var(--bg3); border: none; color: var(--text2); width: 30px; height: 30px; border-radius: 50%; cursor: pointer; font-size: 16px; display: flex; align-items: center; justify-content: center; }
.fav-list { padding: 16px; }
.fav-empty { text-align: center; padding: 60px 20px; color: var(--text3); }
.fav-item { background: var(--card); border: 1px solid var(--border); border-radius: 14px; padding: 14px 16px; margin-bottom: 10px; display: flex; align-items: center; gap: 12px; }
.fav-item-icon { font-size: 28px; flex-shrink: 0; }
.fav-item-body { flex: 1; }
.fav-item-name { font-size: 14px; font-weight: 500; margin-bottom: 3px; }
.fav-item-meta { font-size: 12px; color: var(--text3); }
.fav-remove { background: none; border: none; color: var(--text3); font-size: 18px; cursor: pointer; padding: 4px; }

/* RECENT SEARCHES */
.recent-wrap { padding: 0 16px 8px; }
.recent-label { font-size: 11px; color: var(--text3); margin-bottom: 6px; letter-spacing: .04em; }
.recent-tags { display: flex; gap: 5px; flex-wrap: wrap; }
.recent-tag { font-size: 11px; padding: 4px 10px; border-radius: 99px; background: var(--bg3); color: var(--text2); cursor: pointer; display: flex; align-items: center; gap: 5px; border: none; font-family: 'Noto Sans TC', sans-serif; touch-action: manipulation; }
.recent-tag:active { opacity: .7; }
.recent-x { color: var(--text3); font-size: 10px; }

/* CLEAR SEARCH BTN */
.clear-btn { background: none; border: none; color: var(--text3); font-size: 16px; cursor: pointer; padding: 0 4px; display: none; touch-action: manipulation; }

/* NO MORE RESULTS */
.no-more { text-align: center; padding: 20px; font-size: 12px; color: var(--text3); }

/* EMPTY / LOADING */
.state-box { text-align: center; padding: 60px 20px; color: var(--text3); }
.state-icon { font-size: 44px; margin-bottom: 14px; opacity: .5; }
.state-title { font-size: 15px; color: var(--text2); margin-bottom: 6px; }
.state-sub { font-size: 13px; line-height: 1.6; }
.spinner { width: 32px; height: 32px; border: 2px solid var(--border2); border-top-color: var(--accent); border-radius: 50%; animation: spin .8s linear infinite; margin: 0 auto 16px; }
@keyframes spin { to { transform: rotate(360deg); } }

/* TOAST */
.toast { position: fixed; bottom: 24px; left: 50%; transform: translateX(-50%) translateY(20px); background: var(--bg3); border: 1px solid var(--border2); border-radius: 99px; padding: 10px 20px; font-size: 13px; color: var(--text); z-index: 999; opacity: 0; transition: all .3s; pointer-events: none; white-space: nowrap; }
.toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }

/* DETAIL MODAL */
.modal-overlay { position: fixed; inset: 0; background: rgba(0,0,0,0.7); z-index: 500; display: flex; align-items: flex-end; justify-content: center; cursor: pointer; opacity: 0; pointer-events: none; transition: opacity .2s ease; }
.modal-overlay.show { opacity: 1; pointer-events: auto; }
.modal-box { cursor: default; border-radius: 24px 24px 0 0; transform: translateY(100%); transition: transform .25s cubic-bezier(.32,.72,0,1); }
.modal-overlay.show .modal-box { transform: translateY(0); }
/* modal show handled by opacity */
.modal-box { background: var(--card); border: 1px solid var(--border2); border-radius: 24px 24px 0 0; width: 100%; max-width: 600px; max-height: 80vh; overflow-y: auto; padding: 24px; }
.modal-header { display: flex; justify-content: space-between; align-items: flex-start; margin-bottom: 16px; }
.modal-name { font-size: 20px; font-weight: 500; }
.modal-close { background: var(--bg3); border: 1px solid var(--border2); color: var(--text); width: 40px; height: 40px; border-radius: 50%; cursor: pointer; font-size: 20px; font-weight: 300; display: flex; align-items: center; justify-content: center; touch-action: manipulation; flex-shrink: 0; }
.modal-row { display: flex; align-items: center; gap: 10px; padding: 10px 0; border-bottom: 1px solid var(--border); font-size: 13px; }
.modal-row[onclick]:active { background: rgba(0,201,167,0.06); border-radius: 8px; margin: 0 -8px; padding: 10px 8px; }
.modal-row:last-child { border-bottom: none; }
.modal-icon { font-size: 16px; width: 20px; text-align: center; flex-shrink: 0; }
.modal-val { color: var(--text2); flex: 1; line-height: 1.5; }
.modal-link { color: var(--accent); text-decoration: none; }

.fade-in { opacity: 0; transform: translateY(12px); animation: fadeUp .35s ease forwards; }
@keyframes fadeUp { to { opacity: 1; transform: translateY(0); } }
.fade-in:nth-child(1){animation-delay:.04s}
.fade-in:nth-child(2){animation-delay:.09s}
.fade-in:nth-child(3){animation-delay:.14s}
.fade-in:nth-child(4){animation-delay:.19s}
.fade-in:nth-child(5){animation-delay:.24s}
</style>
</head>
<body>

<div class="glow-orb orb1"></div>
<div class="glow-orb orb2"></div>

<!-- MAIN APP -->
<div id="main-app">
  <header>
    <div class="header-inner">
      <div class="logo">美食<span>雷達</span><div class="logo-sub">FOOD RADAR</div></div>
      <div style="display:flex;align-items:center;gap:10px">
        <div class="view-toggle">
          <button class="vtab active" onclick="switchView('list',this)">列表</button>
          <button class="vtab" onclick="switchView('map',this)">地圖</button>
        </div>
        <div class="loc-pill" id="locPill">
          <div class="loc-dot"></div>
          <span id="locText">定位中...</span>
        </div>
      </div>
    </div>
  </header>

  <div id="map-container"><div id="map"></div></div>

  <div class="search-wrap">
    <div class="search-label">✦ 搜尋美食</div>
    <div class="ai-search-box">
      <div style="position:relative;display:flex;align-items:flex-start">
      <textarea id="searchInput" style="flex:1" placeholder="輸入關鍵字或描述需求，例如：安靜咖啡廳、約會餐廳、宵夜..." onkeydown="handleKey(event)" oninput="toggleClear()"></textarea>
      <button class="clear-btn" id="clearBtn" onclick="clearSearch()" style="position:absolute;right:12px;top:14px">✕</button>
      </div>
      <div class="search-footer">
        <div class="quick-tags">
          <button class="qtag" onclick="fillSearch('咖啡廳')">☕ 咖啡廳</button>
          <button class="qtag" onclick="fillSearch('日式料理')">🍣 日式</button>
          <button class="qtag" onclick="fillSearch('火鍋')">🍲 火鍋</button>
          <button class="qtag" onclick="fillSearch('甜點')">🍰 甜點</button>
          <button class="qtag" onclick="fillSearch('拉麵')">🍜 拉麵</button>
        </div>
        <button class="search-btn" id="searchBtn" onclick="doSearch()">
          <span id="btnText">搜尋</span> →
        </button>
      </div>
    </div>
  </div>


  <div class="loc-bar">
    <div class="loc-input-wrap">
      <span style="font-size:15px;flex-shrink:0">📍</span>
      <input type="text" class="loc-input" id="locInput" placeholder="輸入地址或地標，例如：台北101、信義區..." onkeydown="if(event.key==='Enter')searchByAddress()">
    </div>
    <div class="loc-btn-row">
      <button class="loc-search-btn" onclick="searchByAddress()">🔍 搜尋此地</button>
      <button class="loc-auto-btn" onclick="relocate()">⊙ 自動定位</button>
    </div>

  <div class="control-panel">
    <div class="control-row">
      <span class="control-label">排序</span>
      <div class="control-pills">
        <button class="sort-btn active" id="sortScore" onclick="setSort('score',this)">✦ 推薦指數</button>
        <button class="sort-btn" id="sortRating" onclick="setSort('rating',this)">★ 星級高低</button>
        <button class="sort-btn" id="sortDist" onclick="setSort('dist',this)">📍 距離近遠</button>
      </div>
    </div>
    <div class="control-row">
      <span class="control-label">類別</span>
      <div class="control-pills">

        <button class="filter-pill" onclick="setCategory(this,'cafe')" data-cat="cafe"><div class="filter-dot" style="background:var(--accent2)"></div>咖啡廳</button>
        <button class="filter-pill" onclick="setCategory(this,'bar')" data-cat="bar"><div class="filter-dot" style="background:var(--teal)"></div>酒吧</button>
        <button class="filter-pill" onclick="setCategory(this,'bakery')" data-cat="bakery"><div class="filter-dot" style="background:var(--pink)"></div>烘焙甜點</button>
        <select class="radius-select" id="radiusSelect" onchange="changeRadius()">
          <option value="500">500m</option>
          <option value="1000" selected>1km</option>
          <option value="2000">2km</option>
          <option value="3000">3km</option>

  </div>

  <div class="recent-wrap" id="recentWrap" style="display:none">
    <div class="recent-label">最近搜尋</div>

  </div>

  <div class="results-area">

      <div class="loading-bar" id="loadingBar"><div class="loading-bar-inner"></div></div>
    </div>

      <div class="results-title">找到 <strong id="resultCount">0</strong> 間</div>
    </div>
    <div id="resultsList">
      <div class="state-box">
        <div class="state-icon">📍</div>
        <div class="state-title">正在取得你的位置...</div>
        <div class="state-sub">請允許瀏覽器存取位置權限</div>
      </div>
    </div>
  </div>
</div>

<!-- DETAIL MODAL -->
<div class="modal-overlay" id="modal" onclick="closeModal(event)">
  <div class="modal-box" id="modalBox">
    <div class="modal-header">
      <div>
        <div class="modal-name" id="mName"></div>
        <div style="font-size:12px;color:var(--text3);margin-top:3px" id="mType"></div>
      </div>
      <div style="display:flex;gap:8px;align-items:center"><button class="fav-btn" id="favBtn" onclick="toggleFav()">🤍</button><button class="modal-close" onclick="document.getElementById('modal').classList.remove('show')">✕</button></div>

<!-- BOTTOM NAV -->
<nav class="bottom-nav">
  <button class="bnav-btn active" id="bnav-home" onclick="bnavSwitch('home',this)">
    <span class="bnav-icon">🍽</span>探索
  </button>
  <button class="bnav-btn" id="bnav-fav" onclick="openFavPanel()">
    <span class="bnav-icon">🤍</span>收藏
  </button>
</nav>

<!-- FAVORITES PANEL -->
<div class="fav-panel" id="favPanel">
  <div class="fav-header">
    <div class="fav-title">🤍 我的收藏</div>
    <button class="fav-close" onclick="closeFavPanel()">✕</button>
  </div>
  <div class="fav-list" id="favList"></div>
</div>

<div class="toast" id="toast"></div>

<script>
const PLACE_TYPES = {
  restaurant: 'restaurant',
  cafe: 'cafe',
  bar: 'bar',
  bakery: 'bakery'
};
const TYPE_LABELS = {
  restaurant: '餐廳', cafe: '咖啡廳', bar: '酒吧', bakery: '烘焙甜點'
};
const EMOJIS = {
  restaurant: '🍽', cafe: '☕', bar: '🥃', bakery: '🥐'
};

const API_KEY = 'AIzaSyAQ0QASgyiJ_jLUCi9wCb3E4ADonC3FGys';
let map = null;
let markers = [];
let userLat = null, userLng = null;
let currentCategory = 'restaurant';
let currentRadius = 1000;
let allPlaces = [];
let placesService = null;

// ── LOAD MAPS SDK ──
function loadGoogleMaps() {
  const script = document.createElement('script');
  script.src = `https://maps.googleapis.com/maps/api/js?key=AIzaSyAQ0QASgyiJ_jLUCi9wCb3E4ADonC3FGys&libraries=places&language=zh-TW&callback=onMapsReady`;
  script.async = true;
  script.onerror = () => showToast('❌ API Key 無效，請確認是否正確');
  document.head.appendChild(script);
}

window.onMapsReady = function() {
  getLocation();
};

// ── GEOLOCATION ──
function getLocation() {
  if (!navigator.geolocation) {
    showToast('瀏覽器不支援定位');
    return;
  }
  navigator.geolocation.getCurrentPosition(pos => {
    userLat = pos.coords.latitude;
    userLng = pos.coords.longitude;
    reverseGeocode(userLat, userLng);
    initMap();
    fetchNearby(currentCategory);
  }, err => {
    document.getElementById('locText').textContent = '無法定位';
    showToast('❌ 無法取得位置，請允許定位權限');
    // fallback: 台北101
    userLat = 25.0339; userLng = 121.5645;
    initMap();
    fetchNearby(currentCategory);
  });
}

function reverseGeocode(lat, lng) {
  const geocoder = new google.maps.Geocoder();
  geocoder.geocode({ location: { lat, lng }, language: 'zh-TW' }, (results, status) => {
    if (status === 'OK' && results[0]) {
      const comp = results[0].address_components;
      const district = comp.find(c => c.types.includes('administrative_area_level_3') || c.types.includes('sublocality_level_1'));
      const city = comp.find(c => c.types.includes('administrative_area_level_1') || c.types.includes('locality'));
      const label = [city?.long_name, district?.long_name].filter(Boolean).join(' ');
      document.getElementById('locText').textContent = label || '目前位置';
    }
  });
}

// ── MAP ──
function initMap() {
  map = new google.maps.Map(document.getElementById('map'), {
    center: { lat: userLat, lng: userLng },
    zoom: 15,
    styles: [
      { elementType: 'geometry', stylers: [{ color: '#1a1a22' }] },
      { elementType: 'labels.text.stroke', stylers: [{ color: '#1a1a22' }] },
      { elementType: 'labels.text.fill', stylers: [{ color: '#8a8990' }] },
      { featureType: 'road', elementType: 'geometry', stylers: [{ color: '#2a2a35' }] },
      { featureType: 'water', elementType: 'geometry', stylers: [{ color: '#0d0d18' }] },
      { featureType: 'poi', stylers: [{ visibility: 'off' }] }
    ],
    disableDefaultUI: true,
    zoomControl: true
  });
  placesService = new google.maps.places.PlacesService(map);
  new google.maps.Marker({
    position: { lat: userLat, lng: userLng },
    map,
    icon: { path: google.maps.SymbolPath.CIRCLE, scale: 8, fillColor: '#00c9a7', fillOpacity: 1, strokeColor: '#fff', strokeWeight: 2 }
  });
}

// ── FETCH PLACES ──
function fetchNearby(type, keyword = '') {
  if (!placesService) return;
  setLoading(true);

  if (keyword) {
    // Use textSearch for keyword queries - better Chinese support
    const req = {
      query: keyword,
      location: new google.maps.LatLng(userLat, userLng),
      radius: currentRadius,
      language: 'zh-TW'
    };
    placesService.textSearch(req, (results, status) => {
      setLoading(false);
      if (status === google.maps.places.PlacesServiceStatus.OK) {
        allPlaces = results;
        renderPlaces(results, keyword);
        updateMapMarkers(results);
      } else if (status === 'ZERO_RESULTS') {
        showEmpty('找不到「' + keyword + '」相關店家', '試試其他關鍵字或擴大搜尋範圍');
      } else {
        showToast('❌ 搜尋失敗：' + status);
        showEmpty('搜尋失敗', '請確認 API Key 已啟用 Places API');
      }
    });
  } else {
    // Use nearbySearch for category browsing
    const req = {
      location: new google.maps.LatLng(userLat, userLng),
      radius: currentRadius,
      type: PLACE_TYPES[type],
      language: 'zh-TW'
    };
    placesService.nearbySearch(req, (results, status) => {
      setLoading(false);
      if (status === google.maps.places.PlacesServiceStatus.OK) {
        allPlaces = results;
        renderPlaces(results, '');
        updateMapMarkers(results);
      } else if (status === 'ZERO_RESULTS') {
        showEmpty('附近沒有找到符合的店家', '試試擴大搜尋範圍或換個類別');
      } else {
        showToast('❌ 搜尋失敗：' + status);
        showEmpty('搜尋失敗', '請確認 API Key 已啟用 Places API');
      }
    });
  }
}

function calcScore(place) {
  const rating = place.rating || 0;
  const reviews = place.user_ratings_total || 0;
  const rScore = (rating / 5) * 60;
  const trust = Math.min(reviews / 1000, 1) * 30;
  const base = 10;
  return Math.min(100, Math.round(rScore + trust + base));
}

function renderPlaces(places, keyword) {
  let sorted = [...places];
  if (currentSort === 'score') {
    sorted.sort((a, b) => calcScore(b) - calcScore(a));
  } else if (currentSort === 'rating') {
    sorted.sort((a, b) => (b.rating || 0) - (a.rating || 0));
  } else if (currentSort === 'dist') {
    sorted.sort((a, b) => {
      const da = calcDistNum(a.geometry?.location);
      const db = calcDistNum(b.geometry?.location);
      return da - db;
    });
  }
  document.getElementById('resultCount').textContent = sorted.length;

  if (keyword) {
    const card = document.getElementById('aiCard');
    card.style.display = 'block';
    document.getElementById('aiThinking').innerHTML = `搜尋「<em>${keyword}</em>」，找到 ${sorted.length} 間符合的店家，已依推薦指數排序。`;
  }

  const list = document.getElementById('resultsList');
  if (sorted.length === 0) { showEmpty('沒有找到店家', '試試換個搜尋條件'); return; }

  list.innerHTML = sorted.map((p, i) => {
    const score = calcScore(p);
    const rating = p.rating || 0;
    const reviews = p.user_ratings_total || 0;
    let isOpen = null;
    try { isOpen = p.opening_hours?.isOpen?.() ?? null; } catch(e) { isOpen = null; }
    let photo = null;
    try { photo = p.photos?.[0]?.getUrl({ maxWidth: 160, maxHeight: 160 }); } catch(e) { photo = null; }
    const stars = renderStars(rating);
    const typeName = p.types?.[0]?.replace(/_/g, ' ') || TYPE_LABELS[currentCategory];
    return `
    <div class="rest-card ${i === 0 ? 'top-pick' : ''} fade-in" onclick="openDetail('${p.place_id}')">
      <div class="card-inner">
        <div class="card-img-wrap">
          ${photo ? `<img class="card-img" src="${photo}" loading="lazy">` : `<div class="card-img-placeholder">${EMOJIS[currentCategory]}</div>`}
          <div class="rank-badge">#${i + 1}</div>
        </div>
        <div class="card-body">
          <div class="card-top">
            <div>
              <div class="card-name">${p.name}</div>
              <div class="card-type">${typeName}</div>
            </div>
            <div class="score-wrap">
              <div class="stars">${stars}</div>
              <div class="score-num">${score}</div>
              <div class="score-label">推薦指數</div>
            </div>
          </div>
          <div class="card-desc">${p.vicinity || p.formatted_address || ''}</div>
          <div class="card-tags">
            ${rating >= 4.5 ? '<span class="ctag ctag-orange">高評分</span>' : ''}
            ${reviews >= 500 ? '<span class="ctag ctag-teal">熱門</span>' : ''}
            ${reviews >= 1000 ? '<span class="ctag ctag-yellow">超人氣</span>' : ''}
            <span class="ctag ctag-gray">⭐ ${rating || 'N/A'}</span>
          </div>
          <div class="card-meta">
            <div class="meta-item">📍 ${formatDist(p.geometry?.location)}</div>
            <div class="meta-item">💬 ${reviews.toLocaleString()} 則</div>
            ${isOpen === true ? '<span class="open-badge">營業中</span>' : isOpen === false ? '<span class="closed-badge">已打烊</span>' : ''}
            <button class="card-fav-btn" id="cfav-${p.place_id}" onclick="event.stopPropagation();quickFav('${p.place_id}','${p.name.replace(/'/g,"\\'")}',${rating},'${(p.vicinity||p.formatted_address||'').replace(/'/g,"\\'")}')">
              ${favorites.some(f => f.id === p.place_id) ? '❤️' : '🤍'}
            </button>
          </div>
        </div>
      </div>
    </div>`;
  }).join('') + (sorted.length > 0 ? `<div class='no-more'>— 已顯示全部 ${sorted.length} 間 —</div>` : '');
}

function renderStars(rating) {
  let html = '';
  for (let i = 1; i <= 5; i++) {
    html += `<span class="star ${i <= Math.round(rating) ? 'full' : 'empty'}">★</span>`;
  }
  return html;
}

function calcDistNum(loc) {
  if (!loc || !userLat) return 99999;
  try {
    const lat = typeof loc.lat === 'function' ? loc.lat() : loc.lat;
    const lng = typeof loc.lng === 'function' ? loc.lng() : loc.lng;
    const R = 6371000;
    const dLat = (lat - userLat) * Math.PI / 180;
    const dLng = (lng - userLng) * Math.PI / 180;
    const a = Math.sin(dLat/2)**2 + Math.cos(userLat * Math.PI/180) * Math.cos(lat * Math.PI/180) * Math.sin(dLng/2)**2;
    return R * 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1-a));
  } catch(e) { return 99999; }
}

function formatDist(loc) {
  if (!loc || !userLat) return '—';
  try {
    const d = calcDistNum(loc);
    return d === 99999 ? '—' : d < 1000 ? Math.round(d) + 'm' : (d/1000).toFixed(1) + 'km';
  } catch(e) { return '—'; }
}

// ── MAP MARKERS ──
function updateMapMarkers(places) {
  markers.forEach(m => m.setMap(null));
  markers = [];
  places.forEach((p, i) => {
    const m = new google.maps.Marker({
      position: p.geometry.location,
      map,
      label: { text: String(i + 1), color: '#fff', fontSize: '11px', fontWeight: '500' },
      icon: { path: google.maps.SymbolPath.CIRCLE, scale: 14, fillColor: i === 0 ? '#ff6b35' : '#1c1c22', fillOpacity: 1, strokeColor: '#ff6b35', strokeWeight: 1.5 }
    });
    m.addListener('click', () => openDetail(p.place_id));
    markers.push(m);
  });
}

// ── PLACE DETAIL ──
function openDetail(placeId) {
  placesService.getDetails({
    placeId,
    fields: ['name', 'rating', 'user_ratings_total', 'formatted_address', 'formatted_phone_number', 'website', 'opening_hours', 'url', 'price_level', 'types'],
    language: 'zh-TW'
  }, (place, status) => {
    if (status !== google.maps.places.PlacesServiceStatus.OK) { showToast('無法取得詳細資訊'); return; }
    document.getElementById('mName').textContent = place.name;
    document.getElementById('mType').textContent = place.types?.[0]?.replace(/_/g, ' ') || '';
    const priceMap = {0:'免費',1:'$ 平價',2:'$$ 中等',3:'$$$ 較貴',4:'$$$$ 高級'};
    const price = (place.price_level != null && place.price_level !== undefined) ? (priceMap[place.price_level] ?? '—') : '無資料';
    const hours = place.opening_hours?.weekday_text?.join('<br>') || '—';
    currentPlaceDetail = place;
    const isFaved = favorites.some(f => f.id === place.place_id);
    document.getElementById('favBtn').textContent = isFaved ? '❤️' : '🤍';
    document.getElementById('mContent').innerHTML = `
      <div class="modal-row"><span class="modal-icon">⭐</span><span class="modal-val">${place.rating || '—'} 分（${(place.user_ratings_total || 0).toLocaleString()} 則評論）</span></div>
      <div class="modal-row"><span class="modal-icon">💰</span><span class="modal-val">價位：${price}</span></div>
      <div class="modal-row"><span class="modal-icon">📍</span><span class="modal-val">${place.formatted_address || '—'}</span></div>
      ${place.formatted_phone_number ? `<div class="modal-row" style="cursor:pointer" onclick="window.location.href='tel:${place.formatted_phone_number.replace(/\\s/g,'')}'"><span class="modal-icon">📞</span><a class="modal-val" style="color:var(--teal);text-decoration:none;font-weight:500">${place.formatted_phone_number}</a><span style="color:var(--teal);font-size:12px;margin-left:auto;flex-shrink:0">點擊撥號 →</span></div>` : ''}
      <div class="modal-row"><span class="modal-icon">🕐</span><span class="modal-val" style="font-size:12px;line-height:1.8">${hours}</span></div>
      ${place.url ? `<div class="modal-row"><span class="modal-icon">🗺</span><a class="modal-link modal-val" href="${place.url}" target="_blank">在 Google Maps 查看</a></div>` : ''}
      ${place.website ? `<div class="modal-row"><span class="modal-icon">🌐</span><a class="modal-link modal-val" href="${place.website}" target="_blank">${place.website}</a></div>` : ''}
      <div style="margin-top:16px">
        <button onclick="navigateTo(${(place.formatted_address||place.name).replace(/'/g,"\'")})" style="width:100%;background:var(--teal);color:#0d0d0f;border:none;padding:13px;border-radius:12px;font-size:14px;font-weight:500;font-family:'Noto Sans TC',sans-serif;cursor:pointer;touch-action:manipulation;">📍 導航到這裡</button>
      </div>
    `;
    document.getElementById('modal').classList.add('show');
  });
}

function closeModal(e) {
  if (e.target === document.getElementById('modal')) {
    document.getElementById('modal').classList.remove('show');
  }
}

// ── SEARCH ──
function doSearch() {
  const q = document.getElementById('searchInput').value.trim();
  if (q) saveRecent(q);
  fetchNearby(currentCategory, q);
}
function fillSearch(t) { document.getElementById('searchInput').value = t; doSearch(); }
function handleKey(e) { if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); doSearch(); } }

// ── FILTER ──
function setCategory(el, cat) {
  document.querySelectorAll('.filter-pill').forEach(p => p.classList.remove('active'));
  el.classList.add('active');
  currentCategory = cat;
  document.getElementById('aiCard').style.display = 'none';
  fetchNearby(cat);
}
function changeRadius() {
  currentRadius = parseInt(document.getElementById('radiusSelect').value);
  fetchNearby(currentCategory);
}

// ── VIEW ──
function switchView(view, el) {
  document.querySelectorAll('.vtab').forEach(t => t.classList.remove('active'));
  el.classList.add('active');
  document.getElementById('map-container').style.display = view === 'map' ? 'block' : 'none';
  if (view === 'map' && map) google.maps.event.trigger(map, 'resize');
}

// ── UTILS ──
function setLoading(on) {
  const btn = document.getElementById('searchBtn');
  const list = document.getElementById('resultsList');
  btn.disabled = on;
  document.getElementById('btnText').textContent = on ? '搜尋中...' : '搜尋';
  if (on) list.innerHTML = `<div class="state-box"><div class="spinner"></div><div class="state-title">搜尋附近店家中...</div></div>`;
}
function showEmpty(title, sub) {
  document.getElementById('resultsList').innerHTML = `<div class="state-box"><div class="state-icon">🔍</div><div class="state-title">${title}</div><div class="state-sub">${sub}</div></div>`;
  document.getElementById('resultCount').textContent = '0';
}
function showToast(msg) {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  setTimeout(() => t.classList.remove('show'), 3000);
}


// ── LOCATION SEARCH ──
let currentSort = 'score';

function searchByAddress() {
  const addr = document.getElementById('locInput').value.trim();
  if (!addr) { showToast('請輸入地址或地標'); return; }
  const geocoder = new google.maps.Geocoder();
  geocoder.geocode({ address: addr, language: 'zh-TW' }, (results, status) => {
    if (status === 'OK' && results[0]) {
      userLat = results[0].geometry.location.lat();
      userLng = results[0].geometry.location.lng();
      const name = results[0].formatted_address;
      document.getElementById('locText').textContent = name.length > 12 ? name.substring(0,12)+'...' : name;
      if (map) {
        map.setCenter({ lat: userLat, lng: userLng });
        map.setZoom(15);
      }
      fetchNearby(currentCategory);
      showToast('✓ 已切換到：' + results[0].formatted_address);
    } else {
      showToast('❌ 找不到這個地址，請試試更精確的描述');
    }
  });
}

function relocate() {
  const btn = document.querySelector('.loc-auto-btn');
  btn.textContent = '定位中...';
  btn.disabled = true;
  navigator.geolocation.getCurrentPosition(pos => {
    userLat = pos.coords.latitude;
    userLng = pos.coords.longitude;
    reverseGeocode(userLat, userLng);
    document.getElementById('locInput').value = '';
    if (map) { map.setCenter({ lat: userLat, lng: userLng }); map.setZoom(15); }
    fetchNearby(currentCategory);
    btn.textContent = '⊙ 自動定位';
    btn.disabled = false;
    showToast('✓ 已更新為目前位置');
  }, () => {
    showToast('❌ 無法取得位置，請確認定位權限');
    btn.textContent = '⊙ 自動定位';
    btn.disabled = false;
  });
}

// ── SORT ──
function setSort(type, el) {
  currentSort = type;
  document.querySelectorAll('.sort-btn').forEach(b => b.classList.remove('active'));
  el.classList.add('active');
  if (allPlaces.length > 0) renderPlaces(allPlaces, '');
}


// ── FAVORITES ──
let favorites = JSON.parse(localStorage.getItem('fr_favs') || '[]');
let currentPlaceDetail = null;

function toggleFav() {
  if (!currentPlaceDetail) return;
  const p = currentPlaceDetail;
  const idx = favorites.findIndex(f => f.id === p.place_id);
  if (idx >= 0) {
    favorites.splice(idx, 1);
    document.getElementById('favBtn').textContent = '🤍';
    showToast('已移除收藏');
  } else {
    favorites.push({ id: p.place_id, name: p.name, type: p.types?.[0] || '', rating: p.rating, address: p.formatted_address });
    document.getElementById('favBtn').textContent = '❤️';
    showToast('✓ 已加入收藏');
  }
  localStorage.setItem('fr_favs', JSON.stringify(favorites));
  renderFavList();
}

function openFavPanel() {
  renderFavList();
  document.getElementById('favPanel').classList.add('open');
  document.querySelectorAll('.bnav-btn').forEach(b => b.classList.remove('active'));
  document.getElementById('bnav-fav').classList.add('active');
}
function closeFavPanel() {
  document.getElementById('favPanel').classList.remove('open');
  document.getElementById('bnav-home').classList.add('active');
  document.getElementById('bnav-fav').classList.remove('active');
}

function renderFavList() {
  const list = document.getElementById('favList');
  if (favorites.length === 0) {
    list.innerHTML = '<div class="fav-empty"><div style="font-size:40px;margin-bottom:12px">🤍</div><div style="font-size:15px;color:var(--text2);margin-bottom:6px">還沒有收藏</div><div style="font-size:13px">點開店家詳情，按愛心加入收藏</div></div>';
    return;
  }
  list.innerHTML = favorites.map((f,i) => `
    <div class="fav-item">
      <div class="fav-item-icon">${EMOJIS[currentCategory] || '🍽'}</div>
      <div class="fav-item-body">
        <div class="fav-item-name">${f.name}</div>
        <div class="fav-item-meta">⭐ ${f.rating || '—'} · ${f.address || ''}</div>
      </div>
      <button class="fav-remove" onclick="removeFav(${i})">✕</button>
    </div>`).join('');
}

function removeFav(i) {
  favorites.splice(i, 1);
  localStorage.setItem('fr_favs', JSON.stringify(favorites));
  renderFavList();
}

// ── RECENT SEARCHES ──
let recentSearches = JSON.parse(localStorage.getItem('fr_recent') || '[]');

function saveRecent(q) {
  if (!q) return;
  recentSearches = [q, ...recentSearches.filter(r => r !== q)].slice(0, 6);
  localStorage.setItem('fr_recent', JSON.stringify(recentSearches));
  renderRecent();
}

function renderRecent() {
  const wrap = document.getElementById('recentWrap');
  const tags = document.getElementById('recentTags');
  if (recentSearches.length === 0) { wrap.style.display = 'none'; return; }
  wrap.style.display = 'block';
  tags.innerHTML = recentSearches.map(r => `
    <button class="recent-tag" onclick="fillSearch('${r}')">
      🕐 ${r} <span class="recent-x" onclick="removeRecent(event,'${r}')">✕</span>
    </button>`).join('');
}

function removeRecent(e, r) {
  e.stopPropagation();
  recentSearches = recentSearches.filter(x => x !== r);
  localStorage.setItem('fr_recent', JSON.stringify(recentSearches));
  renderRecent();
}

// ── CLEAR SEARCH ──
function clearSearch() {
  document.getElementById('searchInput').value = '';
  document.getElementById('clearBtn').style.display = 'none';
  document.getElementById('aiCard').style.display = 'none';
  fetchNearby(currentCategory);
}
function toggleClear() {
  const val = document.getElementById('searchInput').value;
  document.getElementById('clearBtn').style.display = val ? 'block' : 'none';
}

// ── BOTTOM NAV ──
function bnavSwitch(tab, el) {
  document.querySelectorAll('.bnav-btn').forEach(b => b.classList.remove('active'));
  el.classList.add('active');
}

// ── QUICK FAV FROM CARD ──
function quickFav(placeId, name, rating, address) {
  const idx = favorites.findIndex(f => f.id === placeId);
  const btn = document.getElementById('cfav-' + placeId);
  if (idx >= 0) {
    favorites.splice(idx, 1);
    if (btn) btn.textContent = '🤍';
    showToast('已移除收藏');
  } else {
    favorites.push({ id: placeId, name, type: currentCategory, rating, address });
    if (btn) btn.textContent = '❤️';
    showToast('✓ 已加入收藏');
  }
  localStorage.setItem('fr_favs', JSON.stringify(favorites));
  // Also update modal favBtn if same place is open
  if (currentPlaceDetail?.place_id === placeId) {
    document.getElementById('favBtn').textContent = idx >= 0 ? '🤍' : '❤️';
  }
}

// ── NAVIGATE ──
function navigateTo(address) {
  const encoded = encodeURIComponent(address);
  const isIOS = /iPad|iPhone|iPod/.test(navigator.userAgent);
  const url = isIOS
    ? 'maps://maps.apple.com/?q=' + encoded
    : 'https://www.google.com/maps/search/?api=1&query=' + encoded;
  window.open(url, '_blank');
}

// ── INIT ──
loadGoogleMaps();
renderRecent();

// Fix iOS input zoom reset
document.querySelectorAll('input, textarea').forEach(el => {
  el.addEventListener('blur', () => {
    if (/iPhone|iPad|iPod/.test(navigator.userAgent)) {
      document.body.style.zoom = 1;
      window.scrollTo(0, window.scrollY);
    }
  });
});
</script>
